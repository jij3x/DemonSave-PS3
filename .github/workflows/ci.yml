# Continuous Integration — runs on every push to main/master and every PR.
#
# This workflow owns all quality gates (lint, format, unit + integration tests,
# Rust tests, coverage). It is the source of the `test` status check that branch
# protection requires before a pull request can be merged.
#
# The cross-platform build/release pipeline lives in release.yml and is
# intentionally NOT triggered on pull requests (it's expensive and already
# covered there on push to main and on tags).

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref so force-pushes and rapid PR updates
# don't burn CI minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Install rpcs3-mcp-server dependencies
        # rpcs3-mcp-server is a self-contained, portable package with its own
        # lockfile and its own eslint/prettier/tsc tooling. Its deps
        # (@modelcontextprotocol/sdk, zod, @types/node) must be present for the
        # server's own `npm run lint` (tsc) to resolve them.
        working-directory: rpcs3-mcp-server
        run: npm ci || npm install

      - name: Lint (CSS + JS + type check)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Lint rpcs3-mcp-server
        working-directory: rpcs3-mcp-server
        run: npm run lint

      - name: Format check rpcs3-mcp-server
        working-directory: rpcs3-mcp-server
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run integration tests
        run: npm run test:integration

      - name: Generate fuzz corpus
        run: npm run fuzz:corpus

      - name: Fuzz smoke — readSave
        run: npm run fuzz:readsave:smoke

      - name: Fuzz smoke — PFD parser
        run: npm run fuzz:pfd:smoke

      - name: Fuzz smoke — SFO parser
        run: npm run fuzz:sfo:smoke

      - name: Fuzz smoke — read/write round-trip
        run: npm run fuzz:roundtrip:smoke

      - name: Fuzz smoke — openSave pipeline
        run: npm run fuzz:pipeline:smoke

      - name: Fuzz smoke — encrypted export pipeline
        run: npm run fuzz:encexport:smoke

      - name: Fuzz smoke — crypto round-trip
        run: npm run fuzz:crypto:smoke

      - name: Fuzz smoke — PFD create
        run: npm run fuzz:pfdcreate:smoke

      - name: Fuzz smoke — PFD serialize
        run: npm run fuzz:pfdserialize:smoke

      - name: Fuzz smoke — save-folder API
        run: npm run fuzz:savefolder:smoke

      - name: Fuzz smoke — save-api folder orchestration
        run: npm run fuzz:saveapi:smoke

      - name: Fuzz smoke — SFO fields
        run: npm run fuzz:sfofields:smoke

      - name: Coverage gate
        run: npm run test:coverage
