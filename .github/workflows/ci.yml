# Continuous Integration — runs on every push to main/master and every PR.
#
# This workflow owns all quality gates (lint, format, unit + integration tests,
# Rust tests, fuzz smokes, coverage). Gates are split into PARALLEL jobs so the
# JS checks never pay the Rust/webkit toolchain tax and the 12 fuzz smokes run
# concurrently rather than serially blocking the rest:
#   js   — lint, format, unit + integration tests, coverage
#          (pure Node; no Rust, no apt system deps)
#   rust — cargo test (needs Rust + the webkit/system dev libs; no npm)
#   fuzz — one matrix runner per fuzz target (12 parallel), each running its
#          60s smoke; extracted from js so it can't block lint/test/coverage
#   container — builds the .devcontainer image and runs lint + unit tests inside
#          it, ONLY when .devcontainer/ / docker-compose.yml / .dockerignore
#          change. Guards the "develop with zero host installs" path against
#          Dockerfile/compose drift (heavy: full image build).
#
# All jobs run on ubuntu-24.04: required because @jazzer.js/fuzzer's native
# addon (fuzzer-linux-x64.node) needs GLIBC 2.38; ubuntu-22.04 (GLIBC 2.35)
# fails to load it. Do not downgrade.
#
# Heavy installs/compiles are cached so warm runs are fast:
#   - npm deps              → setup-node cache (root + rpcs3-mcp-server lockfiles)
#   - cargo registry/target → Swatinem/rust-cache (the big win: skips the full
#                             Tauri dependency recompile)
# The webkit/system apt libs are reinstalled each run (plain apt-get). An apt
# cache (awalsh128/cache-apt-pkgs-action) was tried but it did not restore
# libwebkit2gtk-4.1-dev's transitive libgtk-3-dev tree, so pkg-config couldn't
# find gdk-3.0 and the build failed.
# The Rust toolchain is intentionally NOT cached: a static-key ~/.rustup cache
# would freeze `stable` (restore runs before the toolchain install), and the
# ~1m download is small next to the cached compile.
#
# The cross-platform build/release pipeline lives in release.yml and is
# intentionally NOT triggered on pull requests (it's expensive and already
# covered there on push to main and on tags).

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cancel superseded runs on the same ref so force-pushes and rapid PR updates
# don't burn CI minutes on stale commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # JS gates — lint, format, unit + integration tests, fuzz, coverage.
  # Pure Node: no Rust toolchain, no webkit/system apt deps.
  # ──────────────────────────────────────────────────────────────────
  js:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          # Key the npm cache on BOTH lockfiles so a change to either busts it.
          cache-dependency-path: |
            package-lock.json
            rpcs3-mcp-server/package-lock.json

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Install rpcs3-mcp-server dependencies
        working-directory: rpcs3-mcp-server
        run: npm ci || npm install

      - name: Lint (CSS + JS + type check)
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Lint rpcs3-mcp-server
        working-directory: rpcs3-mcp-server
        run: npm run lint

      - name: Format check rpcs3-mcp-server
        working-directory: rpcs3-mcp-server
        run: npm run format:check

      - name: Run unit tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Coverage gate
        run: npm run test:coverage

  # ──────────────────────────────────────────────────────────────────
  # Rust gates — cargo test. Needs Rust + the webkit/system dev libs;
  # no npm/frontend (tauri_build tolerates the missing dist/ dir).
  # ──────────────────────────────────────────────────────────────────
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # ──────────────────────────────────────────────────────────────────
  # Fuzz gates — one parallel runner per target (matrix). Extracted from
  # the js job so the 12 smoke steps run concurrently (~2.5 min wall) and
  # no longer block lint/test/coverage. fail-fast is off so a crash in one
  # target still lets the others finish for triage.
  # ──────────────────────────────────────────────────────────────────
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - readsave
          - pfd
          - sfo
          - roundtrip
          - pipeline
          - encexport
          - saveapi
          - crypto
          - pfdcreate
          - pfdserialize
          - savefolder
          - sfofields
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Generate fuzz corpus
        run: npm run fuzz:corpus

      - name: Fuzz smoke — ${{ matrix.target }}
        run: npm run fuzz:${{ matrix.target }}:smoke

  # ──────────────────────────────────────────────────────────────────
  # Dev-container gate — builds the .devcontainer image and runs the JS
  # gates (lint + unit tests) INSIDE it, so Dockerfile / compose drift can't
  # silently break the "develop with zero host installs" path. Heavy (full
  # image build), so it only runs when the container definition changes, and
  # the build uses the GitHub Actions layer cache so repeat runs are fast.
  # ──────────────────────────────────────────────────────────────────
  container:
    runs-on: ubuntu-24.04
    # dorny/paths-filter lists PR changed files via the GitHub API on
    # pull_request events; the workflow-level contents:read alone 403s there.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Detect container-file changes
        id: changes
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            container:
              - '.devcontainer/**'
              - 'docker-compose.yml'
              - '.dockerignore'

      - name: Set up Docker Buildx
        if: steps.changes.outputs.container == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Built via build-push-action (not plain `docker compose build`) for the
      # GHA layer cache; compose picks the loaded image up by its `image:` name.
      - name: Build dev container image (GHA-cached)
        if: steps.changes.outputs.container == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: .devcontainer/Dockerfile
          push: false
          load: true
          tags: demonsave-ps3-dev:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The checkout is owned by the runner user (uid 1001) but compose runs
      # as the image's `vscode` user (uid 1000); post-create.sh rewrites
      # generated files (js/des-db/idx-upgrade-ref.js) inside the bind mount,
      # which EACCESes without this.
      - name: Make workspace writable by the container user
        if: steps.changes.outputs.container == 'true'
        run: sudo chown -R 1000:1000 .

      - name: Start container + bootstrap deps
        if: steps.changes.outputs.container == 'true'
        run: |
          docker compose up -d --wait
          docker compose exec -T app bash .devcontainer/post-create.sh

      - name: Lint (inside container)
        if: steps.changes.outputs.container == 'true'
        run: docker compose exec -T app npm run lint

      - name: Unit tests (inside container)
        if: steps.changes.outputs.container == 'true'
        run: docker compose exec -T app npm test
