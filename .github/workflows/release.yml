# GitHub Actions workflow for cross-platform Tauri v2 builds.
#
# Triggers:
#   - Push to main/master       → builds + uploads CI artifacts
#   - Tag push (v*, e.g. v1.0)  → builds + creates a draft GitHub Release
#
# Produces per-platform installers:
#   Windows:  .exe (NSIS installer) + portable .exe (raw binary)
#   macOS:    .dmg
#   Linux:    .deb + .rpm (installer group), .AppImage (portable group)
#   Browser:  demonsave_ps3_html.zip (platform-independent)
#
# Linux is split into two CI jobs so the GitHub Release page shows two
# clearly separated asset groups:
#   linux-installer → .deb + .rpm   (small — rely on the system webview)
#   linux-portable  → .AppImage      (large ~77 MB — self-contained)
#
# Release assets are uploaded via softprops/action-gh-release (not
# tauri-apps/tauri-action) so we control asset naming and upload order.
# A dedicated `release` job collects all staged assets and attaches them
# to a single draft release, avoiding parallel-upload races.

name: Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

# Avoid races between overlapping tag pushes (and cancel stale main pushes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Build Tauri app for each platform / bundle group in parallel
  # ──────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — native installers (small; webview via system deps)
          - platform: ubuntu-22.04
            bundle-args: '--bundles deb,rpm'
            asset-prefix: linux-installer
            artifact-name: demonsave_ps3_linux_installer
          # Linux — portable AppImage (large; bundles the webview)
          - platform: ubuntu-22.04
            bundle-args: '--bundles appimage'
            asset-prefix: linux-portable
            artifact-name: demonsave_ps3_linux_portable
          # Windows — NSIS installer + portable binary
          - platform: windows-latest
            bundle-args: '--bundles nsis'
            asset-prefix: windows
            artifact-name: demonsave_ps3_windows
          # macOS — DMG
          - platform: macos-latest
            bundle-args: '--bundles dmg'
            asset-prefix: macos
            artifact-name: demonsave_ps3_macos

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm ci || npm install

      # NOTE: .rpm bundling works on Ubuntu — Tauri v2's RPM bundler is
      # pure Rust (the `rpm` crate) and does not require rpmbuild/Fedora.
      - name: Build Tauri app
        run: npx tauri build ${{ matrix.bundle-args }}

      # ── Branch push: upload CI artifacts (grouped per matrix entry) ──
      - name: Upload CI artifacts (branch push)
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/demonsave-ps3.exe

      # ── Tag push: stage prefixed assets for the release job ──
      # Prefixing groups files visually on the release page (alphabetical
      # sort): linux-installer-* and linux-portable-* form two blocks.
      - name: Stage release assets (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets

          # Copy every bundle artifact with a group prefix.
          find src-tauri/target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.exe' -o -name '*.dmg' \) -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              cp "$f" "release-assets/${{ matrix.asset-prefix }}-$base"
            done

          # Windows also produces a portable raw .exe outside bundle/.
          if [ -f src-tauri/target/release/demonsave-ps3.exe ]; then
            cp src-tauri/target/release/demonsave-ps3.exe \
               "release-assets/${{ matrix.asset-prefix }}-portable-demonsave-ps3.exe"
          fi

          echo "=== Staged files ==="
          ls -la release-assets/

      - name: Upload staged assets (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.asset-prefix }}
          path: release-assets/*

  # ──────────────────────────────────────────────────────────────────
  # Build browser-only ZIP distribution (platform-independent)
  # ──────────────────────────────────────────────────────────────────
  browser-zip:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build browser distribution (raw files)
        run: node tools/pack-html-dist.mjs --raw-only

      - name: Upload browser distribution as CI artifact
        uses: actions/upload-artifact@v5
        with:
          name: demonsave_ps3_html
          path: dist/demonsave_ps3_html/

      # Stage prefixed assets for the release job (tag push only).
      # The raw files are zipped on the fly with the system `zip` and a
      # matching .sha256 is generated, so the release page still ships a
      # single browser-demonsave_ps3_html.zip (+ checksum).
      - name: Stage browser ZIP for release (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Zip from dist/ using a relative ../ path so the archive stores
          # the demonsave_ps3_html/ top-level folder. (zip & sha256sum are
          # preinstalled on GitHub-hosted ubuntu runners.)
          (cd dist && zip -r -9 ../release-assets/browser-demonsave_ps3_html.zip demonsave_ps3_html)
          (cd release-assets && sha256sum browser-demonsave_ps3_html.zip > browser-demonsave_ps3_html.zip.sha256)

      - name: Upload staged browser assets (tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v5
        with:
          name: release-browser
          path: release-assets/*

  # ──────────────────────────────────────────────────────────────────
  # Create GitHub Release with all assets (tag push only)
  # ──────────────────────────────────────────────────────────────────
  release:
    needs: [build, browser-zip]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - name: Download all staged release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: List collected assets
        run: ls -la release-assets/

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DemonSave-PS3 ${{ github.ref_name }}
          draft: true
          prerelease: false
          # Alphabetical sort puts the two Linux groups adjacent:
          #   browser-…, linux-installer-…, linux-portable-…, macos-…, windows-…
          files: release-assets/*

  # NOTE: Lint, tests, and the coverage gate live in ci.yml (the "CI"
  # workflow). This file only handles cross-platform builds and releases.
