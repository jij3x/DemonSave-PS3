# GitHub Actions workflow for cross-platform Tauri v2 builds.
#
# Triggers:
#   - Tag push (v*, e.g. v1.0)  → builds + creates a draft GitHub Release
#   - workflow_dispatch         → manual runs:
#       mode=test    (default) build + stage assets as workflow-run
#                              artifacts; no release. Works on any branch/tag.
#       mode=release            same as a tag push; must be dispatched ON a
#                              v* tag ref (see the dispatch dropdown).
#   Branch pushes / PR merges intentionally do NOT run this workflow — CI
#   gates live in ci.yml, and per-merge cross-platform builds would be pure
#   cost with nothing to publish.
#
# Produces per-platform installers:
#   Windows:  NSIS .exe installer + portable .zip (wraps versioned .exe)
#   macOS:    zipped .app bundle + .dmg (Apple Silicon only — macos-latest = ARM64)
#   Linux:    .deb + .rpm (installer group), .tar.gz portable binary (portable group)
#   Browser:  demonsave_ps3_html_<VER>.zip (platform-independent)
#
# Staged release assets and their archive members are version-stamped from
# src-tauri/tauri.conf.json (matching the version Tauri bakes into installer
# filenames). Sole exception: the macOS .app bundle keeps its conventional
# unversioned name; only its zip filename is stamped.
#
# Linux is split into two CI jobs so the GitHub Release page shows two
# clearly separated asset groups:
#   linux-installer → .deb + .rpm       (small — rely on the system webview)
#   linux-portable  → .tar.gz binary     (small — needs system webview libs)
#
# Release assets are uploaded via softprops/action-gh-release (not
# tauri-apps/tauri-action) so we control asset naming and upload order.
# A dedicated `release` job collects all staged assets and attaches them
# to a single draft release, avoiding parallel-upload races.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          test = build + stage assets as run artifacts (no release);
          release = create draft release (must run on a v* tag ref)
        type: choice
        default: test
        options:
          - test
          - release

permissions:
  contents: write

# Avoid races between overlapping runs on the same ref (tag pushes and
# repeated dispatches).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Build Tauri app for each platform / bundle group in parallel
  # ──────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux — native installers (small; webview via system deps)
          - platform: ubuntu-22.04
            bundle-args: '--bundles deb,rpm'
            asset-prefix: linux-installer
          # Linux — portable binary (small; needs system WebKitGTK)
          - platform: ubuntu-22.04
            bundle-args: '--no-bundle'
            asset-prefix: linux-portable
          # Windows — NSIS installer + portable binary
          - platform: windows-latest
            bundle-args: '--bundles nsis'
            asset-prefix: windows
          # macOS — .app bundle + .dmg (Apple Silicon only; macos-latest = ARM64)
          - platform: macos-latest
            bundle-args: '--bundles app,dmg'
            asset-prefix: macos

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install npm dependencies
        run: npm ci || npm install

      # NOTE: .rpm bundling works on Ubuntu — Tauri v2's RPM bundler is
      # pure Rust (the `rpm` crate) and does not require rpmbuild/Fedora.
      - name: Build Tauri app
        run: npx tauri build ${{ matrix.bundle-args }}

      # ── Tag push / dispatch: stage prefixed assets for the release job ──
      # Prefixing groups files visually on the release page (alphabetical
      # sort): linux-installer-* and linux-portable-* form two blocks.
      - name: Stage release assets (tag push / dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          # Version-stamp asset names via the shared tools/get-version.mjs
          # (single source: package.json, synced into tauri.conf.json) so
          # portable names match the version Tauri bakes into installer
          # filenames. On tag refs, a tag not carrying this version fails
          # the build — someone tagged before bumping the version. Branch
          # dispatches have no tag to compare, so the guard is skipped.
          APP_VERSION="$(node tools/get-version.mjs)"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && \
             [ "${GITHUB_REF_NAME#v}" != "$APP_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version ${APP_VERSION} — bump the version before tagging." >&2
            exit 1
          fi
          mkdir -p release-assets

          # Copy every bundle artifact with a group prefix.
          # Guard: `--no-bundle` builds (e.g. linux-portable) skip the
          # bundler entirely and never create bundle/, so find would fail
          # under `set -e`. Skip the copy block in that case — the raw
          # binary / .exe / .app blocks below handle the non-bundled output.
          if [ -d src-tauri/target/release/bundle ]; then
            find src-tauri/target/release/bundle -type f \
              \( -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o -name '*.dmg' \) -print0 |
              while IFS= read -r -d '' f; do
                base="$(basename "$f")"
                cp "$f" "release-assets/${{ matrix.asset-prefix }}-$base"
              done
          fi

          # Linux portable: the raw binary outside bundle/ is the primary
          # artifact for the `linux-portable` matrix entry (`--no-bundle`).
          # Compress as .tar.gz to shrink the download and preserve the
          # executable permission bit on extraction. The tar member is
          # renamed to demonsave-ps3_<VER> so the extracted file
          # self-identifies its version.
          #
          # NOTE: `tauri build` also emits this raw binary for every other
          # matrix entry (deb,rpm / nsis / app,dmg), so the file-existence
          # check alone would over-fire and stage duplicate .tar.gz assets
          # under the linux-installer / windows / macos prefixes. Gate on
          # the prefix to stage it only for linux-portable.
          if [ "${{ matrix.asset-prefix }}" = "linux-portable" ] && \
             [ -f src-tauri/target/release/demonsave-ps3 ]; then
            mkdir -p stage-tar
            cp -p src-tauri/target/release/demonsave-ps3 \
               "stage-tar/demonsave-ps3_${APP_VERSION}"
            tar -czf \
              "release-assets/${{ matrix.asset-prefix }}-demonsave-ps3_${APP_VERSION}.tar.gz" \
              -C stage-tar "demonsave-ps3_${APP_VERSION}"
            rm -rf stage-tar
          fi

          # Windows also produces a portable raw .exe outside bundle/. Ship it
          # zipped (avoids browser "untrusted download" warnings for raw
          # executables), version-stamped inside and out. 7z is preinstalled
          # on the GitHub-hosted Windows image; this block only executes on
          # the Windows matrix leg (the .exe exists nowhere else).
          if [ -f src-tauri/target/release/demonsave-ps3.exe ]; then
            cp -p src-tauri/target/release/demonsave-ps3.exe \
               "windows-portable-demonsave-ps3_${APP_VERSION}.exe"
            7z a -tzip \
              "release-assets/windows-portable-demonsave-ps3_${APP_VERSION}.zip" \
              "windows-portable-demonsave-ps3_${APP_VERSION}.exe"
            rm -f "windows-portable-demonsave-ps3_${APP_VERSION}.exe"
          fi

          # macOS: the .app is a directory, so zip it (preserving bundle
          # metadata via ditto) into a single uploadable file. The zip
          # filename is version-stamped; the .app bundle itself keeps its
          # conventional unversioned name (Finder identity, clean
          # replace-in-/Applications upgrades).
          app_dir="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)"
          if [ -n "$app_dir" ] && [ -d "$app_dir" ]; then
            app_base="$(basename "$app_dir")"
            repo_root="$(pwd)"
            (cd "$(dirname "$app_dir")" && ditto -c -k --keepParent "$app_base" \
               "${repo_root}/release-assets/${{ matrix.asset-prefix }}-${app_base%.app}_${APP_VERSION}.app.zip")
          fi

          echo "=== Staged files ==="
          ls -la release-assets/

      - name: Upload staged assets (tag push / dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: release-${{ matrix.asset-prefix }}
          path: release-assets/*
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Build browser-only ZIP distribution (platform-independent)
  # ──────────────────────────────────────────────────────────────────
  browser-zip:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build browser distribution (raw files)
        run: node tools/pack-html-dist.mjs --raw-only

      # Stage prefixed assets for the release job (tag push / dispatch).
      # The raw files are zipped on the fly with the system `zip`, with a
      # version-stamped filename and top-level folder.
      - name: Stage browser ZIP for release (tag push / dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION="$(node tools/get-version.mjs)"
          mkdir -p release-assets
          # Zip from dist/ using a relative ../ path so the archive stores a
          # single top-level folder. The folder is copied to
          # demonsave_ps3_html_<VER> so the extracted directory
          # self-identifies its version. (zip is preinstalled on
          # GitHub-hosted ubuntu runners.)
          cp -a dist/demonsave_ps3_html "dist/demonsave_ps3_html_${APP_VERSION}"
          (cd dist && zip -r -9 \
            "../release-assets/browser-demonsave_ps3_html_${APP_VERSION}.zip" \
            "demonsave_ps3_html_${APP_VERSION}")
          rm -rf "dist/demonsave_ps3_html_${APP_VERSION}"

      - name: Upload staged browser assets (tag push / dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: release-browser
          path: release-assets/*
          if-no-files-found: error

  # ──────────────────────────────────────────────────────────────────
  # Create GitHub Release with all assets (tag push, or dispatch
  # mode=release on a v* tag ref — the step below fails fast otherwise)
  # ──────────────────────────────────────────────────────────────────
  release:
    needs: [build, browser-zip]
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')
    runs-on: ubuntu-22.04
    steps:
      # mode=release dispatched on a branch can never produce a correct
      # release (no tag ref → no tag/version match, no tag for the draft);
      # fail in seconds instead of after the ~30 min build.
      - name: Guard — release mode requires a tag ref
        if: github.event_name == 'workflow_dispatch' && github.ref_type != 'tag'
        run: |
          echo "::error::Dispatch mode=release must run on a v* tag ref (pick the tag in the run-workflow dropdown). Use mode=test for branch runs." >&2
          exit 1

      - name: Download all staged release assets
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: List collected assets
        run: ls -la release-assets/

      # Guard against a silently incomplete draft: a misfired staging guard
      # or a skipped matrix leg would otherwise publish missing platforms.
      - name: Verify staged asset groups
        run: |
          set -euo pipefail
          cd release-assets
          fail() { echo "::error::$1" >&2; exit 1; }
          for prefix in linux-installer linux-portable windows macos browser; do
            ls "${prefix}-"* >/dev/null 2>&1 || fail "no staged assets for prefix '${prefix}'"
          done
          count() { find . -maxdepth 1 -name "$1" | wc -l; }
          expect_one() {
            n="$(count "$1")"
            [ "$n" -eq 1 ] || fail "expected exactly one file matching '$1', found $n"
          }
          expect_one 'linux-portable-*.tar.gz'
          expect_one 'browser-*.zip'
          expect_one 'windows-*portable*.zip'
          expect_one 'windows-*setup.exe'
          expect_one 'macos-*.dmg'
          expect_one 'macos-*.app.zip'

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: DemonSave-PS3 ${{ github.ref_name }}
          draft: true
          prerelease: false
          # Alphabetical sort puts the two Linux groups adjacent:
          #   browser-…, linux-installer-…, linux-portable-…, macos-…, windows-…
          files: release-assets/*

  # NOTE: Lint, tests, and the coverage gate live in ci.yml (the "CI"
  # workflow). This file only handles cross-platform builds and releases.
