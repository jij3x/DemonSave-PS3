[package]
name = "demonsave-ps3"
version = "1.1.0"
description = "Demon's Souls (PS3) Save Editor"
edition = "2021"

[lib]
name = "demonsave_ps3_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.17"
base64 = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
