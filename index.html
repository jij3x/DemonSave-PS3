<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1024, initial-scale=1.0" />
  <title>DemonSave-PS3</title>
  <link rel="stylesheet" href="css/styles.css" />
  <script type="importmap">
  {
    "imports": {
      "@noble/ciphers/aes.js": "./node_modules/@noble/ciphers/aes.js",
      "@noble/hashes/hmac.js": "./node_modules/@noble/hashes/hmac.js",
      "@noble/hashes/legacy.js": "./node_modules/@noble/hashes/legacy.js",
      "fflate": "./node_modules/fflate/esm/browser.js"
    }
  }
  </script>

</head>
<body>
  <div id="app"></div>
  <script>
    // TEMP DIAGNOSTIC (remove once the Windows boot issue is resolved):
    // Release Tauri builds have no devtools, so a frontend load/eval failure
    // otherwise shows a blank window. This surfaces the real error on-screen.
    (function () {
      var box = document.createElement('div');
      box.style.cssText =
        'position:fixed;inset:0;margin:0;padding:24px;overflow:auto;' +
        'font:13px/1.5 ui-monospace,Consolas,Menlo,monospace;white-space:pre-wrap;' +
        'background:#1b0606;color:#ff9b9b;z-index:2147483647;display:none;';
      document.body.appendChild(box);
      function reveal(kind, text) {
        console.error('[boot]', kind, text);
        box.textContent =
          'Frontend failed to start [' + kind + ']\n\n' + text +
          '\n\n(window.__TAURI__=' + typeof window.__TAURI__ +
          ', window.isTauri=' + typeof window.isTauri + ')';
        box.style.display = 'block';
        audit();
      }
      // Probe key files in the import graph and report which are served by the
      // embedded frontend. The top-level <script> error blames app.js even when
      // a deeper import (e.g. version.js) is the real 404 — this finds it.
      var PROBE = [
        'js/ui/app.js',
        'js/version.js',
        'js/ui/dom.js',
        'js/ui/io.js',
        'js/lib/tauri-bridge.js',
        'js/des-savefile/save-api.js',
        'css/styles.css',
        'vendor/@noble/ciphers/aes.js',
        'vendor/fflate/esm/browser.js',
      ];
      function audit() {
        Promise.all(
          PROBE.map(function (p) {
            return fetch(p)
              .then(function (r) {
                return p + ' -> HTTP ' + r.status;
              })
              .catch(function (err) {
                return p + ' -> FETCH ERROR ' + err.message;
              });
          }),
        ).then(function (lines) {
          box.textContent += '\n\n— embedded-file audit —\n' + lines.join('\n');
        });
      }
      window.addEventListener(
        'error',
        function (e) {
          // Script/module load failure (e.g. 404) — target is the <script> tag.
          var t = e.target;
          if (t && t.tagName === 'SCRIPT' && t.src) {
            reveal('module-load', 'Failed to load script/module:\n  ' + t.src);
            return;
          }
          // Eval error — message + source location + stack.
          var detail = e.message || '(no message)';
          if (e.filename) detail += '\n  at ' + e.filename + ':' + e.lineno + ':' + e.colno;
          if (e.error && e.error.stack) detail += '\n\n' + e.error.stack;
          reveal('error', detail);
        },
        true,
      );
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        reveal('unhandledrejection', (r && (r.stack || r.message)) || String(r));
      });
      setTimeout(function () {
        if (
          !document.getElementById('app').children.length &&
          box.style.display === 'none'
        ) {
          reveal(
            'timeout',
            'No error fired but #app is still empty after 6s — likely a module ' +
              'failed to load (404). Run `npm run tauri:dev` and check the console ' +
              '/ Network tab to see which file.',
          );
        }
      }, 6000);
    })();
  </script>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
